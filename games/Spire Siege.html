</style></head><body><div id="app"></div><script>

const CARDS=[];
B.forEach(b=>V.forEach(v=>CARDS.push({id:CARDS.length,n:v[0]+" "+b[0],e:b[1],c:Math.min(8,b[2]+v[5]),hp:b[3]*v[2]|0,d:b[4]*v[3]|0,s:b[5]*v[4],r:b[6],k:b[7],col:v[1]})));

let G,me=0,mode,peer,conn,E=[5,5],hand=[],q=[],sel=-1,last=0,sn=0,raf,bd=[],ba=0,done=0,key="";
const T=(x,y,tm,k)=>({x,y,tm,k:k|0,hp:k?2200:1400,m:k?2200:1400,cd:0});
const mk=()=>({u:[],t:[T(80,470,0),T(280,470,0),T(180,525,0,1),T(80,90,1),T(280,90,1),T(180,35,1,1)],time:180,id:1,over:0});
const FX=[],P=[],SEEN={},FL={};let BG,PT=0,MP=null;
function bgc(){const c=document.createElement("canvas");c.width=720;c.height=1120;const x=c.getContext("2d");x.scale(2,2);
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#6fbf5f");g.addColorStop(.5,"#8bd16f");g.addColorStop(1,"#6fbf5f");x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<12;i++)for(let j=0;j<19;j++)if((i+j)%2){x.fillStyle="#ffffff14";x.fillRect(i*30,j*30,30,30)}
 for(const lx of[80,280]){x.fillStyle="#c9a66b";x.beginPath();x.roundRect(lx-30,40,60,480,14);x.fill();x.fillStyle="#dcc08a";x.beginPath();x.roundRect(lx-25,45,50,470,12);x.fill()}
 g=x.createLinearGradient(0,258,0,302);g.addColorStop(0,"#7dd3fc");g.addColorStop(1,"#0ea5e9");x.fillStyle=g;x.fillRect(0,260,W,40);x.fillStyle="#fff9";x.fillRect(0,258,W,3);x.fillRect(0,299,W,3);
 for(const bx of[80,280]){x.fillStyle="#7c4f24";x.fillRect(bx-26,254,52,48);for(let k=0;k<6;k++){x.fillStyle=k%2?"#a9713a":"#b8814a";x.fillRect(bx-24,256+k*7.7,48,7)}x.fillStyle="#5b3716";x.fillRect(bx-28,254,4,48);x.fillRect(bx+24,254,4,48)}
 x.font="26px serif";x.textAlign="center";x.textBaseline="middle";
 [[180,160,"🌳"],[160,210,"🌲"],[205,120,"🌲"],[180,400,"🌳"],[160,350,"🌲"],[205,440,"🌲"],[22,150,"🌲"],[338,150,"🌲"],[22,410,"🌲"],[338,410,"🌲"],[130,100,"🌸"],[232,215,"🌿"],[130,445,"🌿"],[232,355,"🌸"],[20,250,"🌿"],[340,320,"🌿"]].forEach(([a,b,e])=>x.fillText(e,a,b));
 x.strokeStyle="#0003";x.lineWidth=6;x.strokeRect(0,0,W,H);return c}
function puff(x,y,c,n,s){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=s*(.4+Math.random()*.8);P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,c})}}

function tower(x,o,px,py,mine){const k=o.k,w=k?46:36,h=k?40:32,c=mine?["#60a5fa","#1d4ed8"]:["#f87171","#b91c1c"];

 const g=x.createLinearGradient(px-w/2,0,px+w/2,0);g.addColorStop(0,"#f1f5f9");g.addColorStop(1,"#94a3b8");x.fillStyle=g;x.beginPath();x.roundRect(px-w/2,py-h/2,w,h,5);x.fill();
 x.fillStyle="#64748b";for(let i=0;i<4;i++)x.fillRect(px-w/2+i*w/4+1,py-h/2-5,w/4-3,6);
 x.fillStyle=c[1];x.fillRect(px-w/2,py-h/2+7,w,8);x.fillStyle="#1e293b";x.beginPath();x.roundRect(px-5,py+2,10,h/2-2,[5,5,0,0]);x.fill();
 if(k){x.font="22px serif";x.fillText("👑",px,py-h/2-13)}else{x.strokeStyle="#475569";x.lineWidth=2;x.beginPath();x.moveTo(px,py-h/2-5);x.lineTo(px,py-h/2-26);x.stroke();x.fillStyle=c[0];x.beginPath();x.moveTo(px,py-h/2-26);x.lineTo(px+15,py-h/2-20);x.lineTo(px,py-h/2-14);x.fill()}
 bar(x,px,py+h/2+6,w,o.hp/o.m,mine?"#4ade80":"#f87171");x.font="bold 9px system-ui";x.strokeStyle="#0008";x.lineWidth=3;x.strokeText(o.hp|0,px,py+h/2+19);x.fillStyle="#fff";x.fillText(o.hp|0,px,py+h/2+19)}
function draw2(){const t=performance.now()/1e3,dt=Math.min(.1,t-PT);PT=t;
 const x=$("#cv").getContext("2d"),f=me==1,X=v=>f?W-v:v,Y=v=>f?H-v:v;BG=BG||bgc();
 x.setTransform(2,0,0,2,0,0);x.drawImage(BG,0,0,W,H);x.textAlign="center";x.textBaseline="middle";
 x.strokeStyle="#fff9";x.lineWidth=1.5;for(let i=0;i<9;i++){const sx=(i*47+t*18)%W,yy=272+i%3*9;x.beginPath();x.moveTo(sx,yy);x.quadraticCurveTo(sx+8,yy-4,sx+16,yy);x.stroke()}
 const h=hand[sel];
 if(h&&!h.sp){x.fillStyle="rgba(255,255,255,"+(.12+.06*Math.sin(t*5))+")";x.fillRect(0,300,W,H-300);x.setLineDash([8,6]);x.strokeStyle="#fff";x.lineWidth=2;x.strokeRect(2,302,W-4,H-304);x.setLineDash([])}

 for(const o of[...G.t,...G.u].sort((a,b)=>Y(a.y)-Y(b.y))){const mine=o.tm==me,px=X(o.x);
  if(o.k!==undefined){tower(x,o,px,Y(o.y),mine);continue}

  const g=x.createRadialGradient(px-3,py-4,2,px,py,r+2);g.addColorStop(0,mine?"#93c5fd":"#fca5a5");g.addColorStop(1,mine?"#1d4ed8":"#b91c1c");
  x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.lineWidth=3;x.strokeStyle=o.col||"#fff";x.stroke();
  x.font="17px serif";x.fillStyle="#fff";x.fillText(o.e,px,py+1);
  if(t-(FL[o.id]||0)<.12){x.fillStyle="#fff9";x.beginPath();x.arc(px,py,r,0,7);x.fill()}
  if(o.hp<o.m)bar(x,px,py-r-9,22,o.hp/o.m,mine?"#4ade80":"#f87171")}
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=dt;if(p.l<=0){P.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;x.globalAlpha=Math.min(1,p.l*2);x.fillStyle=p.c;x.beginPath();x.arc(X(p.x),Y(p.y),2+p.l*5,0,7);x.fill()}x.globalAlpha=1;
 for(let i=FX.length-1;i>=0;i--){const e=FX[i];e.l-=dt;if(e.l<=0){FX.splice(i,1);continue}const k=1-e.l/.6,px=X(e.x),py=Y(e.y),g=x.createRadialGradient(px,py,0,px,py,e.r);
  g.addColorStop(0,"rgba(255,255,255,"+.7*(1-k)+")");g.addColorStop(1,"rgba(255,160,40,"+.5*(1-k)+")");x.fillStyle=g;x.beginPath();x.arc(px,py,e.r*(.4+.6*k),0,7);x.fill();x.font="30px serif";x.globalAlpha=1-k;x.fillText(e.e,px,py);x.globalAlpha=1}
 if(h&&MP){x.globalAlpha=.65;if(h.sp){x.strokeStyle="#fff";x.lineWidth=2;x.beginPath();x.arc(MP[0],MP[1],h.rad,0,7);x.stroke()}x.font="26px serif";x.fillText(h.e,MP[0],MP[1]);x.globalAlpha=1}

 $("#tm").textContent=(s/60|0)+":"+String(s%60).padStart(2,"0");$("#t0").textContent="You 👑 "+cr(me);$("#t1").textContent=(mode=="bot"?"Bot":"Rival")+" 👑 "+cr(1-me);

 app.innerHTML=`<div class="hero"><div class="castle">🏰</div><h1>Spire Siege</h1><p>Deploy troops and crack the enemy keep.</p></div><div class="stats"><span class="chip">💎 ${D.gems}</span><span class="chip">🏆 ${D.w} wins</span><span class="chip">💔 ${D.l} losses</span></div><p class="mut">Daily bonus: +20 gems</p>

function tog(i,el){const j=D.deck.indexOf(i);if(j>=0)D.deck.splice(j,1);else if(D.deck.length<8)D.deck.push(i);else return;sv();el.classList.toggle("s");$("#cn").textContent=D.deck.length;$("#dn").disabled=D.deck.length!=8}
function shop(){app.innerHTML=`<h2>Emote shop. 💎 ${D.gems}</h2><div class="g">${EM.map(([e,p])=>`<button class="c ${D.own.includes(e)?"s":""}" onclick="buy('${e}',${p})" style="font-size:30px">${e}<small>${D.own.includes(e)?"Owned":"💎 "+p}</small></button>`).join("")}</div><p id="st"></p><button onclick="menu()">Back</button>`}
function buy(e,p){if(D.own.includes(e))return;if(D.gems<p)return say("Not enough gems. Win battles to earn more.");D.gems-=p;D.own.push(e);sv();shop()}

// multiplayer (PeerJS): the host runs the match, the guest sends card plays and receives snapshots
function host(){clr();if(!window.Peer)return say("PeerJS did not load. Check your connection and reload.");
 const code=Math.random().toString(36).slice(2,7);peer=new Peer("spiresiege-"+code);
 peer.on("open",()=>say("Room code: <b>"+code+"</b>. Waiting for a friend to join."));
 peer.on("connection",c=>{conn=c;wire(c);const go=()=>bat("host");c.open?go():c.on("open",go)});
 peer.on("error",e=>say("Could not connect ("+e.type+"). Try again."))}
function join(){const code=$("#cd").value.trim().toLowerCase();clr();if(!code)return say("Enter the 5-letter room code.");if(!window.Peer)return say("PeerJS did not load. Check your connection and reload.");
 say("Connecting…");peer=new Peer();
 peer.on("open",()=>{conn=peer.connect("spiresiege-"+code,{reliable:true});wire(conn);conn.on("open",()=>bat("guest"))});
 peer.on("error",e=>say("Could not connect ("+e.type+"). Check the code."))}
function wire(c){
 c.on("data",d=>{
  if(d.t=="s"&&mode=="guest"&&G){G.u=d.u.map(a=>({id:a[0],tm:a[1],e:a[2],x:a[3],y:a[4],hp:a[5],m:a[6],col:a[7],r:a[8]}));d.w.forEach((h,i)=>G.t[i].hp=h);G.time=d.i;G.over=d.o}
  else if(d.t=="p"&&mode=="host"&&G&&!G.over){const k=CARDS[d.c];if(k)spawn(G,k,1,d.x,k.sp?d.y:Math.min(d.y,270))}
  else if(d.t=="m")emo(d.e,1);else if(d.t=="f")FX.push({x:d.x,y:d.y,r:d.r,e:d.e,l:.6})});
 c.on("close",()=>{if(G&&!G.over)G.over=me?2:1})}
const snap=()=>conn&&conn.open&&conn.send({t:"s",u:G.u.map(u=>[u.id,u.tm,u.e,u.x|0,u.y|0,u.hp|0,u.m,u.col,u.r]),w:G.t.map(t=>t.hp|0),i:G.time,o:G.over});

// battle
function spawn(g,c,tm,x,y){
 if(c.sp){FX.push({x,y,r:c.rad,e:c.e,l:.6});if(mode=="host"&&conn&&conn.open)conn.send({t:"f",x,y,r:c.rad,e:c.e});for(const o of[...g.u,...g.t])if(o.tm!=tm&&Math.hypot(o.x-x,o.y-y)<c.rad)o.hp-=o.k!==undefined?c.d/2:c.d;return}
 for(let i=0;i<c.k;i++)g.u.push({id:g.id++,tm,e:c.e,x:x+(i-(c.k-1)/2)*14,y,hp:c.hp,m:c.hp,d:c.d,s:c.s,r:c.r,col:c.col,cd:0})}
function step(g,dt){
 g.time-=dt;
 for(const a of[...g.u,...g.t]){
  if(a.hp<=0)continue;
  const tw=a.k!==undefined;let tg=null,bd=1e9;
  for(const o of tw?g.u:[...g.u,...g.t]){if(o.tm==a.tm||o.hp<=0)continue;const d=Math.hypot(o.x-a.x,o.y-a.y)-(o.k!==undefined?18:6);if(d<bd){bd=d;tg=o}}
  a.cd-=dt;if(!tg)continue;
  if(bd<=(tw?120:a.r)){if(a.cd<=0){tg.hp-=tw?30:a.d;a.cd=tw?.9:1}}
  else if(!tw){const d=Math.hypot(tg.x-a.x,tg.y-a.y)||1;a.x+=(tg.x-a.x)/d*a.s*dt;a.y+=(tg.y-a.y)/d*a.s*dt}}
 g.u=g.u.filter(u=>u.hp>0);
 const k0=g.t[2].hp<=0,k1=g.t[5].hp<=0;
 if(k0||k1||g.time<=0){const s=tm=>g.t.filter(t=>t.tm==tm).reduce((a,t)=>a+Math.max(0,t.hp),0);g.over=k0&&!k1?2:k1&&!k0?1:s(0)>s(1)?1:s(1)>s(0)?2:3}}
function botAI(dt){E[1]=Math.min(10,E[1]+dt*.45);ba+=dt;if(ba<1.3)return;ba=0;
 const c=bd[Math.random()*8|0];if(E[1]<c.c+1)return;E[1]-=c.c;
 let x=40+Math.random()*280,y=110+Math.random()*150;
 if(c.sp){const t=G.u.find(u=>u.tm==0)||G.t[Math.random()*2|0];x=t.x;y=t.y}
 spawn(G,c,1,x,y)}
function bat(m){mode=m;me=m=="guest"?1:0;G=mk();E=[5,5];done=0;sel=-1;key="";
 const d=[...D.deck].sort(()=>Math.random()-.5).map(i=>CARDS[i]);hand=d.slice(0,4);q=d.slice(4);
 if(m=="bot"){bd=[...CARDS].sort(()=>Math.random()-.5).slice(0,8);ba=0}
 app.innerHTML=`<div id="top"><span class="chip" id="t1"></span><span id="tm"></span><span class="chip" id="t0"></span></div><div id="w"><canvas id="cv" width="720" height="1120"></canvas><span class="em" id="e1" style="top:8px;right:8px;opacity:0"></span><span class="em" id="e0" style="bottom:8px;left:8px;opacity:0"></span></div><div id="eb"><span id="en"></span><i></i><span id="nx"></span></div><div class="g" id="hd"></div><div class="r">${D.own.map(e=>`<button onclick="sendE('${e}')">${e}</button>`).join("")}</div>`;
 $("#cv").addEventListener("pointerdown",tap);$("#cv").addEventListener("pointermove",e=>{const r=e.target.getBoundingClientRect();MP=[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]});last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function tap(ev){if(sel<0||G.over)return;const c=hand[sel],r=ev.target.getBoundingClientRect(),vx=(ev.clientX-r.left)/r.width*W,vy=(ev.clientY-r.top)/r.height*H;
 if(!c.sp&&vy<290)return;if(E[me]<c.c)return;E[me]-=c.c;
 if(mode=="guest")conn.send({t:"p",c:c.id,x:W-vx,y:H-vy});else spawn(G,c,0,vx,vy);
 hand[sel]=q.shift();q.push(c);sel=-1}
function emo(e,who){const el=$("#e"+who);if(!el)return;el.textContent=e;el.style.opacity=1;clearTimeout(el.t);el.t=setTimeout(()=>el.style.opacity=0,2000)}
function sendE(e){emo(e,0);if(conn&&conn.open)conn.send({t:"m",e})}
function loop(t){if(!G)return;const dt=Math.min(.1,(t-last)/1e3);last=t;
 if(!G.over){E[me]=Math.min(10,E[me]+dt*.5);
  if(mode!="guest"){step(G,dt);if(mode=="bot")botAI(dt);sn+=dt;if(conn&&sn>.1){sn=0;snap()}}}
 draw2();ui();if(G.over&&!done)fin();raf=requestAnimationFrame(loop)}
function ui(){$("#eb i").style.width=E[me]*10+"%";
 const k=hand.map(c=>c.id)+"|"+sel+"|"+(E[me]|0);if(k==key)return;key=k;
 $("#hd").innerHTML=hand.map((c,i)=>`<button class="c t${Math.min(c.c,6)} ${sel==i?"s":""} ${E[me]<c.c?"d":""}" onclick="sel=${i}">${c.e}<small>${c.n}</small><b>${c.c}</b></button>`).join("")}
function fin(){done=1;if(mode=="host")snap();const o=G.over,dr=o==3,win=o-1==me,g=dr?10:win?25:8;
 D.gems+=g;if(!dr)win?D.w++:D.l++;sv();
 $("#w").insertAdjacentHTML("beforeend",`<div id="ov">${dr?"Draw":win?"Victory!":"Defeat"}<p>+${g} 💎</p><button onclick="menu()">Back to menu</button></div>`)}
function draw(){const x=$("#cv").getContext("2d"),f=me==1,X=v=>f?W-v:v,Y=v=>f?H-v:v;
 x.fillStyle="#6fbf5f";x.fillRect(0,0,W,H);x.fillStyle="#4aa3d9";x.fillRect(0,262,W,36);x.fillStyle="#b8905a";[80,280].forEach(b=>x.fillRect(b-22,260,44,40));
 if(sel>=0&&hand[sel]&&!hand[sel].sp){x.fillStyle="#fff4";x.fillRect(0,300,W,H-300)}
 x.textAlign="center";x.textBaseline="middle";
 for(const o of[...G.t,...G.u]){if(o.hp<=0)continue;const k=o.k!==undefined,r=k?(o.k?24:20):11,px=X(o.x),py=Y(o.y),mine=o.tm==me;
  x.fillStyle=mine?"#2563eb":"#dc2626";x.beginPath();x.arc(px,py,r,0,7);x.fill();
  if(o.col){x.strokeStyle=o.col;x.lineWidth=3;x.stroke()}
  x.font=(r+2)+"px serif";x.fillStyle="#fff";x.fillText(k?(o.k?"👑":"🏰"):o.e,px,py+1);
  x.fillStyle="#0008";x.fillRect(px-r,py-r-8,r*2,4);x.fillStyle=mine?"#93c5fd":"#fca5a5";x.fillRect(px-r,py-r-8,r*2*Math.max(0,o.hp/o.m),4)}
 const s=Math.max(0,G.time|0);x.textAlign="left";x.fillStyle="#123";x.font="bold 15px sans-serif";x.fillText((s/60|0)+":"+String(s%60).padStart(2,"0"),8,276)}
menu();
</script></body></html>
